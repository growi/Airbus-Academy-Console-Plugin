# ArgoCD application for lab content only. The plugin (image, CRDs, RBAC) is deployed with
# bin/pluginctl deploy <target>; this app owns the ConsoleLab objects, so authoring a lab is a
# git push and never a plugin rebuild.
#
# Apply once with cluster-admin, or add it to the Airbus-Educates app-of-apps:
#   oc apply -f deploy/argocd/academy-console-labs.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: academy-console-labs
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/growi/Airbus-Academy-Console-Plugin
    targetRevision: main
    path: labs
  destination:
    server: https://kubernetes.default.svc
    # ConsoleLab is cluster-scoped; the namespace only anchors the Application.
    namespace: academy-console-plugin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        maxDuration: 5m
        factor: 2
