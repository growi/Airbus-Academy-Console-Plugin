{{- if .Values.crds.install }}
# ConsoleLab — pure content data the console plugin reads to render a guided lab.
# Operator-free (no controller), cluster-scoped, same pattern as the portal's Track CRD.
# Lab content is authored in the workshops monorepo and synced by its own ArgoCD application,
# so iterating on a lab never rebuilds the plugin image.
#
# Kept on uninstall: deleting this chart must not delete the lab objects another repository
# published into the cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consolelabs.academy.dcs
  labels:
    {{- include "academy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  group: academy.dcs
  scope: Cluster
  names:
    kind: ConsoleLab
    listKind: ConsoleLabList
    plural: consolelabs
    singular: consolelab
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [title, description, steps]
              properties:
                title:
                  type: string
                description:
                  type: string
                completionText:
                  type: string
                visibility:
                  # default: listed in the console catalog for every user.
                  # hidden: never listed; only reachable through a launch URL that supplies
                  # the parameters the lab templates (e.g. ?ns=<provisioned namespace>).
                  type: string
                  enum: [default, hidden]
                  default: default
                mode:
                  # assisted: the learner acts, the engine verifies (Continue/Back are always
                  # available as a failsafe). timed: the engine performs each step itself.
                  type: string
                  enum: [assisted, timed]
                  default: assisted
                timerDelay:
                  type: string
                  pattern: '^[0-9]+(ms|s)$'
                  default: 5s
                context:
                  # Optional. Declares the resource whose live phase the workflow panel shows.
                  type: object
                  required: [primaryResource, resources]
                  properties:
                    primaryResource:
                      type: string
                    resources:
                      # ponytail: the resource map is validated by the plugin's TS types, not
                      # duplicated here — its keys are author-chosen names.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
                steps:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, title, description, target, complete]
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      target:
                        # ponytail: target/complete are discriminated unions; CRD structural
                        # schemas express those badly, so only the discriminator is typed here.
                        type: object
                        required: [type]
                        properties:
                          type:
                            type: string
                            enum: [quickStartId, href, consoleElement]
                        x-kubernetes-preserve-unknown-fields: true
                      complete:
                        type: object
                        required: [operation, verify]
                        properties:
                          operation:
                            type: object
                            required: [type]
                            properties:
                              type:
                                type: string
                                enum: [activateTarget, fillTarget, navigate, none]
                            x-kubernetes-preserve-unknown-fields: true
                          verify:
                            type: object
                            required: [type]
                            properties:
                              type:
                                type: string
                                enum:
                                  [targetAttribute, targetText, targetValue, namespace, route,
                                   acknowledge]
                            x-kubernetes-preserve-unknown-fields: true
                        x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Title
          type: string
          jsonPath: .spec.title
        - name: Visibility
          type: string
          jsonPath: .spec.visibility
        - name: Mode
          type: string
          jsonPath: .spec.mode
---
# AcademySettings — cluster-wide plugin settings. One object named `cluster`.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: academysettings.academy.dcs
  labels:
    {{- include "academy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  group: academy.dcs
  scope: Cluster
  names:
    kind: AcademySettings
    listKind: AcademySettingsList
    plural: academysettings
    singular: academysettings
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                portalUrl:
                  # Absolute https URL of the DCS Academy portal. Linked from the lab catalog
                  # and used as the only allowed origin for a launch URL's returnUrl.
                  type: string
                  pattern: '^https?://'
                portalLinkText:
                  type: string
                  default: Want more labs? Check out the DCS Academy
      additionalPrinterColumns:
        - name: Portal
          type: string
          jsonPath: .spec.portalUrl
{{- end }}
