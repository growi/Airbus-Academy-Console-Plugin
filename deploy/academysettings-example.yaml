# Per-cluster plugin settings. Not part of any kustomization — the portal URL differs per
# cluster. Copy, set the real portal route, and apply:
#   oc apply -f deploy/academysettings-example.yaml
#
# portalUrl does two things: it is the link at the bottom of the lab catalog, and it is the only
# origin a launch URL's returnUrl may point at.
apiVersion: academy.dcs/v1alpha1
kind: AcademySettings
metadata:
  name: cluster
spec:
  portalUrl: https://academy.apps.example.com
  portalLinkText: Want more labs? Check out the DCS Academy
