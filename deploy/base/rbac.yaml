# Lab content and plugin settings are read by the console plugin in the browser, under the
# logged-in user's own identity. Every authenticated user may read them; nothing here grants
# access to the resources a lab navigates to — that stays governed by namespace RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: academy-lab-reader
rules:
  - apiGroups: [academy.dcs]
    resources: [consolelabs, academysettings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: academy-lab-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: academy-lab-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
