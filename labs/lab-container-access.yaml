# Hidden lab: needs a namespace containing the named pod, so it is only launched from the
# academy portal, which provisions that namespace and passes it in the URL:
#   /academy/lessons/lab-container-access/start?ns=<namespace>&podName=<pod>
# Templated scalars are quoted — an unquoted {{ starts a YAML flow mapping.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: lab-container-access
spec:
  title: Inspect and enter a running container
  description: Find a pod, read its logs, then open a terminal inside its container.
  completionText: Lesson complete — the pod terminal is open.
  visibility: hidden
  mode: assisted
  context:
    primaryResource: labPod
    resources:
      labPod:
        apiVersion: v1
        kind: Pod
        label: Lab pod
        name: '{{podName}}'
        namespace: '{{namespace}}'
        listPath: '/k8s/ns/{{namespace}}/core~v1~Pod'
        consolePath: '/k8s/ns/{{namespace}}/pods/{{podName}}'
        tabs:
          logs: '/k8s/ns/{{namespace}}/pods/{{podName}}/logs'
          terminal: '/k8s/ns/{{namespace}}/pods/{{podName}}/terminal'
  steps:
    - id: open-workloads
      title: Open Workloads
      description: >-
        Expand Workloads. Pods and the controllers that create them are grouped here, so
        this is where you start when inspecting a running application component.
      target: { type: quickStartId, value: qs-nav-workloads }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-pods
      title: Open Pods
      description: >-
        Select Pods to list the workload instances running in this project. A Pod is the
        smallest unit OpenShift schedules onto a node.
      target: { type: consoleElement, id: navigationLink, value: Pods }
      complete:
        operation: { type: navigate, path: '/k8s/ns/{{namespace}}/core~v1~Pod' }
        verify: { type: route, path: '/k8s/ns/{{namespace}}/core~v1~Pod' }
    - id: open-pod
      title: Open the lab pod
      description: >-
        Open {{podName}}. The details page brings status, configuration, logs, events, and
        container access together in one place.
      target: { type: href, value: '/k8s/ns/{{namespace}}/pods/{{podName}}' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/{{namespace}}/pods/{{podName}}' }
        verify: { type: route, path: '/k8s/ns/{{namespace}}/pods/{{podName}}' }
    - id: open-logs
      title: Inspect the logs
      description: >-
        Open Logs before connecting to the container. Logs are the safest first source of
        evidence when diagnosing a running workload — reading them changes nothing.
      target: { type: href, value: '/k8s/ns/{{namespace}}/pods/{{podName}}/logs' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/{{namespace}}/pods/{{podName}}/logs' }
        verify: { type: route, path: '/k8s/ns/{{namespace}}/pods/{{podName}}/logs' }
    - id: open-terminal
      title: Open the container terminal
      description: >-
        Open Terminal to start an interactive session inside the container. In production,
        prefer read-only inspection commands — a container is not a place to keep changes.
      target: { type: href, value: '/k8s/ns/{{namespace}}/pods/{{podName}}/terminal' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/{{namespace}}/pods/{{podName}}/terminal' }
        verify: { type: route, path: '/k8s/ns/{{namespace}}/pods/{{podName}}/terminal' }
