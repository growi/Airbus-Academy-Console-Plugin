# Default lab: pure navigation, no namespaced resource paths, so it works for any
# authenticated user regardless of RBAC or selected project.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: tour-console-basics
spec:
  title: Find your way around the console
  description: Locate the navigation groups that hold workloads, networking, and storage.
  completionText: Tour complete — you can now find any resource group in the navigation.
  visibility: default
  mode: assisted
  steps:
    - id: open-workloads
      title: Open Workloads
      description: >-
        Workloads holds everything that runs your application — Deployments, Pods, Jobs.
        This is the equivalent of oc get deployment,pods.
      target: { type: quickStartId, value: qs-nav-workloads }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-networking
      title: Open Networking
      description: >-
        Networking groups the objects that make an application reachable: Services for
        stable in-cluster addresses and Routes for external URLs.
      target: { type: quickStartId, value: qs-nav-networking }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-storage
      title: Open Storage
      description: >-
        Storage holds PersistentVolumeClaims — the requests your workloads make for
        durable disk space.
      target: { type: quickStartId, value: qs-nav-storage }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    # Expanding Workloads/Networking/Storage collapses Home, so the Projects link has to be
    # brought back into view before the learner can be asked to click it.
    - id: open-home
      title: Open Home
      description: >-
        Home holds the cluster-wide views: your projects, the overview, and search across
        every resource type.
      target: { type: quickStartId, value: qs-nav-home }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    # The project selector only renders on namespaced pages, so a lab that must work from any
    # page teaches the Projects list instead — it exists for every authenticated user.
    - id: open-projects
      title: Open your projects
      description: >-
        Every resource lives in a project (namespace). This list shows the projects you can
        reach, and the selector at the top of a resource page switches between them.
      target: { type: consoleElement, id: navigationLink, value: Projects }
      complete:
        operation: { type: navigate, path: /k8s/cluster/projects }
        verify: { type: route, path: /k8s/cluster/projects }
